[project]
name = "road-to-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karim Ehab", email = "karim.ehab.ai@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "scikit-learn>=1.9.0",
    "skl2onnx>=1.19.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
road-to-mlops = "road_to_mlops.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
